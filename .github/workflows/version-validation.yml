name: CI Validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate-backend:
    name: Validate Backend (Node 22)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies (strict)
        run: npm ci

      - name: Check for dependency conflicts
        run: npm ls --depth=0

      - name: Audit for security vulnerabilities
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Build backend
        run: npm run build

      - name: Run tests
        run: npm test
        continue-on-error: true

  validate-frontend:
    name: Validate Frontend (Node 22)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (strict)
        run: npm ci

      - name: Check for dependency conflicts
        run: npm ls --depth=0

      - name: Audit for security vulnerabilities
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build frontend
        run: npm run build

  compatibility-report:
    name: Generate Compatibility Report
    runs-on: ubuntu-latest
    needs: [validate-backend, validate-frontend]
    permissions:
      contents: read
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Output status
        run: echo "Compatibility checks completed."
