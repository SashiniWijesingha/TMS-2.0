name: Build and Deploy to Azure

on:
  workflow_run:
    workflows: ["CI Validation"]
    types:
      - completed

jobs:
  build:
    # Only run deploy if CI succeeded AND the branch is 'main'
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # BACKEND
      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Build backend
        run: |
          cd backend
          npm run build

      # FRONTEND
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Validate frontend build secrets
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -z "$VITE_GOOGLE_MAPS_API_KEY" ]; then
            echo "Missing GitHub secret: VITE_GOOGLE_MAPS_API_KEY"
            echo "Add it in repo Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Build frontend
        env:
          # VITE_ vars are baked into the JS bundle at build time by Vite.
          # They CANNOT be read from Azure App Service env vars (those are runtime-only).
          # Add VITE_GOOGLE_MAPS_API_KEY to your GitHub repo → Settings → Secrets and variables → Actions
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: |
          cd frontend
          npm run build

      # COPY FRONTEND BUILD INTO BACKEND
      - name: Copy frontend build into backend
        run: |
          mkdir -p backend/frontend
          cp -r frontend/dist/* backend/frontend/

      # PREPARE PRODUCTION DEPENDENCIES & PACKAGE ARTIFACT
      # (We prune devDependencies first, then include node_modules to avoid relying on remote Kudu builds)
      - name: Zip artifact
        run: |
          cd backend
          npm ci --omit=dev
          zip -r ../deployment.zip .

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deployment.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_FC1EA64FD79742ED94765298D3B6C5D4 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6828A9562199404FAF885DC456A8EEDC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8BC04E5066AC420A8DDAD59DC4B6300D }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: devtest1
          slot-name: Production
          package: deployment.zip
